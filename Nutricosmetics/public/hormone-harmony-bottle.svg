<svg width="300" height="400" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bottle Shape -->
  <rect x="100" y="80" width="100" height="280" rx="15" fill="#8B4513" opacity="0.8"/>
  
  <!-- Bottle Cap -->
  <rect x="110" y="60" width="80" height="30" rx="5" fill="#2C1810"/>
  
  <!-- Label -->
  <rect x="105" y="120" width="90" height="120" rx="5" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Text on Label -->
  <text x="150" y="140" text-anchor="middle" fill="#2C3E50" font-size="10" font-weight="bold">HORMONE</text>
  <text x="150" y="155" text-anchor="middle" fill="#2C3E50" font-size="10" font-weight="bold">HARMONY</text>
  <text x="150" y="175" text-anchor="middle" fill="#E74C3C" font-size="8">★★★★★</text>
  
  <!-- Supplement Pills Icon -->
  <circle cx="130" cy="200" r="8" fill="#E74C3C" opacity="0.7"/>
  <circle cx="150" cy="200" r="8" fill="#E74C3C" opacity="0.7"/>
  <circle cx="170" cy="200" r="8" fill="#E74C3C" opacity="0.7"/>
  
  <!-- Additional Details -->
  <text x="150" y="220" text-anchor="middle" fill="#666" font-size="6">96 Capsules</text>
  <text x="150" y="230" text-anchor="middle" fill="#666" font-size="6">Natural Formula</text>
  
  <!-- Bottle Bottom -->
